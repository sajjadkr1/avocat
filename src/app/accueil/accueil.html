<section class="hero">

    <div class="hero-content">

        <h1>
            Trouvez un avocat adapté à votre situation
        </h1>

        <p>
            LegalBridge aide les étrangers en France
            à trouver un avocat adapté à leurs besoins.
        </p>

        <button
            type="button"
            class="hero-btn"
            (click)="ouvrirRecherche()"
        >
            Commencer la recherche
        </button>

    </div>

</section>


<!-- Zone de recherche -->

@if (afficherRecherche) {

    <div
        id="search"
        class="search-container"
    >

        <div class="search-box">

            <h2>
                Trouvez votre avocat
            </h2>


            <!-- Les deux champs de recherche -->

            <div class="search-fields">


                <!-- Problème -->

                <div class="search-field">

                    <label for="probleme">
                        Quel est votre problème ?
                    </label>

                    <select
                        id="probleme"
                        [(ngModel)]="problemeSelectionne"
                    >

                        <option value="">
                            Choisir un problème
                        </option>

                        <option value="immigration">
                            Droit des étrangers
                        </option>

                        <option value="demande d'asile">
                            Demande d'asile
                        </option>

                        <option value="logement">
                            Logement
                        </option>

                        <option value="travail">
                            Droit du travail
                        </option>

                    </select>

                </div>


                <!-- Ville -->

                <div class="search-field">

                    <label for="ville">
                        Votre ville
                    </label>

                    <input
                        id="ville"
                        type="text"
                        placeholder="Ex : Paris"
                        [(ngModel)]="villeSelectionnee"
                    >

                </div>

            </div>


            <!-- Bouton de recherche -->

            <button
                type="button"
                class="search-btn"
                (click)="chercherAvocat()"
            >
                Rechercher un avocat
            </button>

        </div>

    </div>

}
