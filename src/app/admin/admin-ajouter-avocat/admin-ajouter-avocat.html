<section class="admin-page">

  <div class="page-header">

    <h1>Ajouter un avocat</h1>

    <p>
      Ajoutez un nouvel avocat
      à la plateforme.
    </p>

  </div>


  <div class="form-card">

    <div class="form-grid">

      <div class="form-group">

        <label>Nom</label>

        <input
          type="text"
          [(ngModel)]="nouvelAvocat.nom"
        >

      </div>


      <div class="form-group">

        <label>Prénom</label>

        <input
          type="text"
          [(ngModel)]="nouvelAvocat.prenom"
        >

      </div>


      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          [(ngModel)]="nouvelAvocat.email"
        >

      </div>


      <div class="form-group">

        <label>Ville</label>

        <input
          type="text"
          [(ngModel)]="nouvelAvocat.ville"
        >

      </div>


      <div class="form-group">

        <label>Portable</label>

        <input
          type="text"
          [(ngModel)]="nouvelAvocat.portable"
        >

      </div>

    </div>


    <button
      class="btn-primary"
      (click)="ajouterAvocat()"
    >
      Ajouter l'avocat
    </button>

  </div>

</section>
