
<section class="admin-page">

  <div class="page-header">

    <h1>Ajouter un avocat</h1>

    <p>
      Ajoutez un nouvel avocat
      à la plateforme.
    </p>

  </div>

  <div class="form-card">

    <div class="form-grid">

      <!-- Nom -->
      <div class="form-group">

        <label>Nom</label>

        <input
          type="text"
          [(ngModel)]="nouvelAvocat.nom"
        >

      </div>

      <!-- Prénom -->
      <div class="form-group">

        <label>Prénom</label>

        <input
          type="text"
          [(ngModel)]="nouvelAvocat.prenom"
        >

      </div>

      <!-- Email -->
      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          [(ngModel)]="nouvelAvocat.email"
        >

      </div>

      <!-- Ville -->
      <div class="form-group">

        <label>Ville</label>

        <input
          type="text"
          [(ngModel)]="nouvelAvocat.ville"
        >

      </div>

      <!-- Portable -->
      <div class="form-group">

        <label>Portable</label>

        <input
          type="text"
          [(ngModel)]="nouvelAvocat.portable"
        >

      </div>

      <!-- Photo de l'avocat -->
      <div class="form-group">

        <label>Photo de l'avocat</label>

        <input
          #imageInput
          type="file"
          accept="image/jpeg,image/png,image/webp"
          (change)="selectionnerImage($event)"
        >

        @if (apercuImage) {

          <div class="image-preview">

            <img
              [src]="apercuImage"
              alt="Aperçu de la photo"
            >

            <button
              type="button"
              class="remove-image"
              (click)="supprimerImage(imageInput)"
            >
              X
            </button>

          </div>

        }

      </div>

      <!-- Spécialisations -->
      <div
        class="form-group dropdown-group"
        (click)="$event.stopPropagation()"
      >

        <label>Spécialisations</label>

        <button
          type="button"
          class="dropdown-trigger"
          (click)="toggleMenu('specialisations')"
        >

          <span>
            {{ getNomsSelectionnes('specialisations') || 'Choisir les spécialisations...' }}
          </span>

          <span class="arrow">
            ▼
          </span>

        </button>

        <div
          class="dropdown-menu"
          *ngIf="menuOuvert === 'specialisations'"
        >

          <label
            class="dropdown-option"
            *ngFor="let specialisation of specialisations"
          >

            <input
              type="checkbox"
              [checked]="nouvelAvocat.id_specialisations.includes(+specialisation.id_specialisation)"
              (change)="modifierSelection('specialisations', specialisation.id_specialisation, $event)"
            >

            <span>
              {{ specialisation.nom }}
            </span>

          </label>

          <p
            class="empty-message"
            *ngIf="specialisations.length === 0"
          >
            Aucune spécialisation disponible
          </p>

        </div>

      </div>

      <!-- Langues -->
      <div
        class="form-group dropdown-group"
        (click)="$event.stopPropagation()"
      >

        <label>Langues parlées</label>

        <button
          type="button"
          class="dropdown-trigger"
          (click)="toggleMenu('langues')"
        >

          <span>
            {{ getNomsSelectionnes('langues') || 'Choisir les langues...' }}
          </span>

          <span class="arrow">
            ▼
          </span>

        </button>

        <div
          class="dropdown-menu"
          *ngIf="menuOuvert === 'langues'"
        >

          <label
            class="dropdown-option"
            *ngFor="let langue of langues"
          >

            <input
              type="checkbox"
              [checked]="nouvelAvocat.id_langues.includes(+langue.id_langue)"
              (change)="modifierSelection('langues', langue.id_langue, $event)"
            >

            <span>
              {{ langue.nom }}
            </span>

          </label>

          <p
            class="empty-message"
            *ngIf="langues.length === 0"
          >
            Aucune langue disponible
          </p>

        </div>

      </div>

    </div>

    <!-- Bouton Ajouter -->
    <button
  class="btn-primary"
  (click)="ajouterAvocat(imageInput)"
>
      Ajouter l'avocat
    </button>

  </div>

</section>
