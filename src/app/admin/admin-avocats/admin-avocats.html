<section class="admin-page">

  <div class="page-header">

    <h1>Gestion des avocats</h1>

    <p>
      Consultez, modifiez ou supprimez
      les avocats enregistrés.
    </p>

  </div>


  <div class="grid-container">

    <ag-grid-angular
      class="avocats-grid"
      [rowData]="avocats"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="10">
    </ag-grid-angular>

  </div>


  @if (afficherFormulaireModification) {

    <div
      #formModification
      class="form-card"
    >

      <h2>Modifier l'avocat</h2>


      <div class="form-grid">

        <div class="form-group">

          <label>Nom</label>

          <input
            type="text"
            [(ngModel)]="avocatSelectionne.nom"
          >

        </div>


        <div class="form-group">

          <label>Prénom</label>

          <input
            type="text"
            [(ngModel)]="avocatSelectionne.prenom"
          >

        </div>


        <div class="form-group">

          <label>Email</label>

          <input
            type="email"
            [(ngModel)]="avocatSelectionne.email"
          >

        </div>


        <div class="form-group">

          <label>Ville</label>

          <input
            type="text"
            [(ngModel)]="avocatSelectionne.ville"
          >

        </div>


        <div class="form-group">

          <label>Portable</label>

          <input
            type="text"
            [(ngModel)]="avocatSelectionne.portable"
          >

        </div>

      </div>


      <button
        class="btn-primary"
        (click)="enregistrerModification()"
      >
        Enregistrer
      </button>

    </div>

  }

</section>
