@if (avocat) {

    <div class="card">

        <img
            [src]="avocat.img"
            [alt]="'Photo de ' + avocat.prenom + ' ' + avocat.nom"
            class="avocat-image"
        >


        <h2>
            {{ avocat.prenom }} {{ avocat.nom }}
        </h2>


        <p>
            <strong>Spécialité :</strong>
            {{ avocat.specialisation }}
        </p>


        <p>
            <strong>Ville :</strong>
            {{ avocat.ville }}
        </p>


        <p>
            <strong>Langues :</strong>
            {{ avocat.langues?.join(', ') }}
        </p>


        <button
            type="button"
            (click)="voirDetail()"
        >
            Voir les informations
        </button>

    </div>

}
