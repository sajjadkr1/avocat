<section class="avocat-list">

    <h1>
        Les avocats disponibles
    </h1>


    @if (avocats.length > 0) {

        <div class="cards-container">

            @for (avocat of avocats; track avocat.id_avocat) {

                <app-avocat-card
                    [avocat]="avocat">
                </app-avocat-card>

            }

        </div>

    }
    @else {

        <p class="empty-message">
            Aucun avocat trouvé.
        </p>

    }

</section>
